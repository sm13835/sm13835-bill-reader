<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bill Reader</title>
  <style>
    :root {
      --bg: #f6f5f1; --card: #ffffff; --text: #1a1d21; --muted: #5a6068; --border: #dfddd5;
      --accent: #1f3a5f; --bad: #a12a22; --bad-bg: #fbeeec; --warn: #8a5a00; --warn-bg: #fdf4e0;
      --good: #1e6b45; --good-bg: #e9f5ee;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.55;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 1520px; margin: 0 auto; padding: 32px 32px 80px; }
    header { margin-bottom: 20px; }
    .hero { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 32px; align-items: start;
      border-bottom: 2px solid var(--accent); padding-bottom: 20px; }
    .hero h2:first-child { margin-top: 0; }
    .columns, .card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 24px; align-items: start; }
    @media (max-width: 860px) {
      main { padding: 24px 16px 64px; }
      .hero, .columns, .card-grid { grid-template-columns: minmax(0, 1fr); gap: 12px; }
    }
    .kicker { font-size: 13px; color: var(--muted); }
    h1 { font-size: 30px; line-height: 1.2; margin: 4px 0; letter-spacing: -0.01em; }
    h2 { font-size: 20px; margin: 32px 0 12px; color: var(--accent); }
    h3 { font-size: 16px; margin: 0 0 6px; }
    p { margin: 0 0 8px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; margin-bottom: 12px; }
    .alert.direct { background: var(--bad-bg); border-color: var(--bad); }
    .alert.possible { background: var(--warn-bg); border-color: var(--warn); }
    .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px; margin-bottom: 6px; }
    .tag.direct, .tag.hurts { background: var(--bad); color: #fff; }
    .tag.possible, .tag.mixed { background: var(--warn); color: #fff; }
    .tag.helps { background: var(--good); color: #fff; }
    blockquote { margin: 8px 0; padding-left: 12px; border-left: 3px solid var(--border); font-size: 15px; }
    .meta { font-size: 13px; color: var(--muted); }
    .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
    .fact { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
    .fact strong { display: block; font-size: 17px; }
    .chips { margin-top: 8px; font-size: 13px; color: var(--muted); }
    .scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; background: var(--card); }
    th, td { border-bottom: 1px solid var(--border); padding: 7px 10px; text-align: left; white-space: nowrap; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr.new-lines td { border-top: 2px solid var(--accent); }
    a { color: var(--accent); }
    li { margin-bottom: 8px; }
    .map-card { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; }
    .map-card svg { height: 220px; width: auto; flex: none; display: block; }
    .map-text { flex: 1 1 130px; }
    .map-text strong { display: block; font-size: 24px; line-height: 1.2; }
    .state { fill: #edece6; stroke: #a9a79c; stroke-width: 2; }
    .district { fill: transparent; stroke: #cfcdc3; stroke-width: 1.5; }
    .district.current { stroke: #5a6068; stroke-width: 2.5; }
    .district.dem { fill: #c5daf3; }
    .district.rep { fill: #f4c7c2; }
    .district.ind { fill: #dedede; }
    .map-label { font-size: 44px; font-weight: 700; fill: var(--text); text-anchor: middle; dominant-baseline: middle; }
    .sources a { font-size: 12px; white-space: nowrap; margin-right: 6px; }
    .filter { margin-top: 24px; }
    .filter-label { font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter-btn { font: inherit; font-size: 13px; min-height: 32px; padding: 4px 12px; border-radius: 999px; cursor: pointer;
      background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .filter-btn:hover { border-color: var(--accent); }
    .filter-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .filter-btn.no-findings { color: var(--muted); border-style: dashed; }
    .filter-btn[aria-pressed="true"] { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
    .filter-note { margin-top: 12px; }
    .filter-note ul { margin: 8px 0 0; padding-left: 20px; }
    .filter-note li { margin-bottom: 4px; }
  </style>
</head>
<body>
  <main id="app"><p>Loading…</p></main>
  <script>
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const link = (url, label) => `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>`;

    const citedItems = (alert, items) => alert.section_ids.map((id) => items.find((i) => i.section_id === id)).filter(Boolean);

    // An alert belongs to every issue of the bill sections it cites.
    const alertIssues = (alert, items) => [...new Set(citedItems(alert, items).flatMap((i) => i.issues || []))];

    function alertCard(alert, promise, items) {
      const cited = citedItems(alert, items);
      const issues = alertIssues(alert, items);
      return `<div class="card alert ${esc(alert.severity)}">
        <span class="tag ${esc(alert.severity)}">${alert.severity === 'direct' ? 'Direct conflict' : 'Possible tension'}</span>
        <h3>${esc(promise.topic)}</h3>
        <p>${esc(alert.explanation)}</p>
        <blockquote>“${esc(promise.quote)}”
          <div class="meta">${esc(promise.strength)} · ${esc(promise.source_type)}, ${esc(promise.date)} · ${link(promise.url, 'source')}<br />Scope: ${esc(promise.scope)}</div>
        </blockquote>
        ${cited.map((i) => `<blockquote>“${esc(i.bill_quote)}”<div class="meta">Bill text, Sec. ${esc(i.section_id)}, ${esc(i.section_header)}</div></blockquote>`).join('')}
        ${issues.length ? `<div class="chips">Issues: ${issues.map(esc).join(' · ')}</div>` : ''}
      </div>`;
    }

    function itemCard(item, facts) {
      const cited = item.district_facts.map((key) => facts.find((f) => f.key === key))
        .filter(Boolean).map((f) => `${esc(f.label)}: <strong>${esc(f.display)}</strong>`).join(' · ');
      return `<div class="card">
        <span class="tag ${esc(item.effect)}">${esc(item.effect)}</span>
        <h3>${esc(item.headline)}</h3>
        <p>${esc(item.plain_english)}</p>
        <p>${esc(item.who_in_district)}</p>
        <blockquote>“${esc(item.bill_quote)}”<div class="meta">Sec. ${esc(item.section_id)}, ${esc(item.section_header)}</div></blockquote>
        <div class="chips">District evidence: ${cited}</div>
        ${(item.issues || []).length ? `<div class="chips">Issues: ${item.issues.map(esc).join(' · ')}</div>` : ''}
      </div>`;
    }

    const shownEffects = new Set(['helps', 'hurts', 'mixed']);

    // The analyzed findings a reader can see, narrowed to one issue if one is chosen.
    function findingsFor(brief, issue) {
      return brief.items.filter((i) => shownEffects.has(i.effect) && (!issue || (i.issues || []).includes(issue)));
    }

    // Issues with findings come first, most findings first. Other always goes last.
    function filterHtml(brief, active) {
      const issues = (brief.issues || []).map((issue) => ({ ...issue, count: findingsFor(brief, issue.name).length }))
        .sort((a, b) => (a.name === 'Other') - (b.name === 'Other') || b.count - a.count || b.sections.length - a.sections.length);
      if (!issues.length) return '';
      const button = (value, label, cls) =>
        `<button type="button" class="filter-btn ${cls}" data-issue="${esc(value)}" aria-pressed="${value === active}">${esc(label)}</button>`;
      const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
      return `<div class="filter"><div class="filter-label">Filter by issue</div>
        <div class="filter-row">${button('', 'All issues', '')}${issues.map((i) =>
          button(i.name, `${i.name} · ${plural(i.sections.length, 'section')} · ${plural(i.count, 'finding')}`, i.count ? '' : 'no-findings')).join('')}</div>
        <p class="meta filter-note">Sections are the parts of the bill that touch an issue. Findings are the ones analyzed for how they affect your district. A dashed button means the bill touches that issue but this brief has no district finding on it yet.</p></div>`;
    }

    // Written so an empty result can never be read as "this issue has no effect."
    function issueNote(brief, issue, findings) {
      if (!issue) {
        const total = findingsFor(brief).length;
        return `<p class="meta filter-note">Showing the highest-priority findings out of ${total}. Choose an issue to see every finding on it.</p>`;
      }
      const shown = new Set(findings.map((i) => i.section_id));
      const entry = brief.issues.find((i) => i.name === issue);
      const others = entry.sections.filter((s) => !shown.has(s.section_id));
      const count = `${others.length} section${others.length === 1 ? '' : 's'}`;
      const sourceLink = (s) => s.page ? link(`${brief.bill_pdf_url}#page=${s.page}`, `Sec. ${s.section_id} (p. ${s.page})`) : `Sec. ${esc(s.section_id)}`;
      const list = `<ul>${others.map((s) => `<li>${sourceLink(s)}: ${esc(s.header)}</li>`).join('')}</ul>`;
      if (!findings.length) {
        return `<div class="card alert possible filter-note"><strong>No district finding on ${esc(issue)} yet.</strong>
          The bill has ${count} on this issue, but this brief did not analyze them for your district. That does not mean they have no effect here.${list}</div>`;
      }
      if (!others.length) return '';
      return `<div class="card filter-note"><strong>Not reflected below:</strong> ${count} on ${esc(issue)} with no district finding in this brief. That does not mean they have no effect here.
        <details><summary>See these sections</summary>${list}</details></div>`;
    }

    function findingsHtml({ brief, district }, issue) {
      const findings = findingsFor(brief, issue);
      if (issue && !findings.length) return issueNote(brief, issue, findings);
      const byEffect = (effect, limit) => {
        const matching = findings.filter((i) => i.effect === effect);
        return issue ? matching : matching.slice(0, limit); // A chosen issue shows every finding on it.
      };
      const cards = (items) => items.map((i) => itemCard(i, district.facts)).join('');
      const none = '<div class="card">None identified.</div>';
      const mixed = byEffect('mixed', 4);
      return `${issueNote(brief, issue, findings)}
        <div class="columns">
          <div><h2>Most harmful to your district</h2>${cards(byEffect('hurts', 6)) || none}</div>
          <div><h2>Most helpful to your district</h2>${cards(byEffect('helps', 6)) || none}</div>
        </div>
        ${mixed.length ? `<h2>Mixed effects</h2><div class="card-grid">${cards(mixed)}</div>` : ''}`;
    }

    // Written so an empty result can never be read as "no conflict on this issue."
    function alertsHtml({ brief, promises }, issue) {
      const c = brief.coverage;
      const all = brief.promise_alerts || [];
      const alerts = issue ? all.filter((a) => alertIssues(a, brief.items).includes(issue)) : all;
      const empty = issue && all.length
        ? `No promise alert cites a section on ${esc(issue)}. This does not mean no conflict exists: alerts can only cite sections analyzed in depth, and only ${c.promises_checked} commitments were reviewed.`
        : `None found among the ${c.promises_checked} commitments reviewed. This does not mean no conflict exists.`;
      return `<h2>Promise alerts if you vote yes</h2>
        ${issue && alerts.length ? `<p class="meta">Showing ${alerts.length} of ${all.length} alerts: those citing a section on ${esc(issue)}.</p>` : ''}
        <div class="card-grid">${alerts.map((a) => alertCard(a, promises.find((p) => p.id === a.promise_id), brief.items)).join('') ||
          `<div class="card">${empty}</div>`}</div>
        <p class="meta">${c.promises_checked} of ${c.promises_reviewed} commitments checked against the whole bill. A commitment that is not in this set cannot trigger an alert.</p>`;
    }

    // Filtering redraws only the findings and alerts; the rest of the page stays where it is.
    function wireFilter(data) {
      const row = document.querySelector('.filter-row');
      if (!row) return;
      row.addEventListener('click', (event) => {
        const chosen = event.target.closest('.filter-btn');
        if (!chosen) return;
        row.querySelectorAll('.filter-btn').forEach((b) => b.setAttribute('aria-pressed', String(b === chosen)));
        document.getElementById('findings').innerHTML = findingsHtml(data, chosen.dataset.issue);
        document.getElementById('alerts').innerHTML = alertsHtml(data, chosen.dataset.issue);
      });
    }

    function briefHtml(data) {
      const { brief } = data;
      if (!brief) {
        return { details: '', summary: `<div class="card"><h3>No brief generated yet</h3>
          <p>Add your OpenRouter key to <code>.env</code>, then run <code>node app/analyze.js</code> and reload this page.</p></div>` };
      }
      const c = brief.coverage;
      const notCovered = c.not_covered_headers || [];
      const incomplete = c.screen_failures.length + c.deep_failures.length + c.not_analyzed_due_to_cap;
      const summary = `
        <h2>What this bill does</h2>
        ${notCovered.length ? `<div class="card alert possible"><strong>This brief is not complete.</strong>
          ${notCovered.length} sections flagged as relevant to this district were not analyzed in depth, so the findings below may leave out important effects.
          <details><summary>See the sections not covered</summary><ul>${notCovered.map((h) => `<li>${esc(h)}</li>`).join('')}</ul></details></div>` : ''}
        <div class="card"><ul>${brief.overview.what_it_does.map((b) => `<li>${esc(b.text)}
          <span class="sources">${b.sources.map((s) => link(`${brief.bill_pdf_url}#page=${s.page}`, `Sec. ${s.section_id} (p. ${s.page})`)).join(' ')}</span></li>`).join('')}</ul>
          <p class="meta">Links open the official bill text on GovInfo at the page where each section begins.</p>
          <p><strong>For NJ-5:</strong> ${esc(brief.overview.district_bottom_line)}</p></div>`;
      const details = `
        ${filterHtml(brief, '')}
        <div id="findings">${findingsHtml(data, '')}</div>
        <div id="alerts">${alertsHtml(data, '')}</div>

        <h2>What was reviewed</h2>
        <div class="card"><p>${c.sections_screened} of ${c.sections_total} sections screened; ${c.flagged} flagged; ${c.analyzed} analyzed in depth.
          ${c.dropped_by_verification.length} findings removed because their citations failed verification.</p>
          ${incomplete ? `<p><strong>Incomplete:</strong> ${c.screen_failures.length} sections failed screening, ${c.deep_failures.length} failed analysis, and ${c.not_analyzed_due_to_cap} flagged sections exceeded the analysis cap.</p>` : ''}
          <p class="meta">Models: ${esc(brief.models.screen)}, ${esc(brief.models.deep)} · Run cost: $${esc(brief.cost_usd)} · Generated ${esc(brief.generated_at)}</p></div>`;
      return { summary, details };
    }

    function mapHtml(map, district) {
      const party = { D: ['dem', 'Democrat'], R: ['rep', 'Republican'] }[district.party] || ['ind', 'Independent'];
      const current = map.districts.find((d) => d.id === district.district);
      const others = map.districts.filter((d) => d !== current);
      const path = (d, cls) => `<path class="${cls}" d="${esc(d.path)}"><title>${esc(d.id)}</title></path>`;
      return `<div class="card map-card">
        <svg viewBox="${esc(map.viewBox)}" role="img" aria-label="Map of New Jersey with ${esc(district.district)} highlighted">
          <path class="state" d="${esc(map.state_path)}" />
          ${others.map((d) => path(d, 'district')).join('')}
          ${path(current, `district current ${party[0]}`)}
          <text class="map-label" x="${current.label_x}" y="${current.label_y}">${esc(current.id)}</text>
        </svg>
        <div class="map-text">
          <strong>${esc(district.district)}</strong>
          <p>${esc(district.member)}</p>
          <p class="meta">Shaded in the member's party color: ${party[1]}.<br />Boundaries: ${link(map.source_url, 'U.S. Census Bureau')}, 119th Congress.</p>
        </div>
      </div>`;
    }

    function districtHtml(district) {
      const rows = district.elections.map((e, i, all) => {
        const prev = all[i - 1];
        const change = prev ? (e.margin_pts - prev.margin_pts).toFixed(1) : '';
        const sign = (n) => (n > 0 ? '+' : '') + n;
        return `<tr class="${e.new_lines ? 'new-lines' : ''}">
          <td>${e.year}${e.new_lines ? ' (new lines)' : ''}</td><td>${esc(e.dem)}</td><td class="num">${e.dem_pct}%</td>
          <td>${esc(e.rep)}</td><td class="num">${e.rep_pct}%</td><td class="num">${e.total_votes.toLocaleString()}</td>
          <td class="num">D ${sign(e.margin_pts)}</td><td class="num">${change === '' ? '' : (e.new_lines ? 'n/a' : sign(Number(change)))}</td></tr>`;
      }).join('');
      return `
        <h2>District profile: ${esc(district.district)}</h2>
        <div class="facts">${district.facts.map((f) => `<div class="fact"><strong>${esc(f.display)}</strong><span class="meta">${esc(f.label)}</span></div>`).join('')}</div>
        <h2>House elections, 2006–2024</h2>
        <div class="scroll"><table><thead><tr><th>Year</th><th>Democrat</th><th class="num">%</th><th>Republican</th><th class="num">%</th>
          <th class="num">Total votes</th><th class="num">Margin</th><th class="num">Change</th></tr></thead><tbody>${rows}</tbody></table></div>
        <p class="meta">District lines were redrawn for 2012 and 2022, so changes across those years are not like-for-like and are not calculated.</p>
        <h2>This member's votes on this bill</h2>
        <div class="card">${district.votes_on_bill.map((v) => `<p>${esc(v.date)} · ${esc(v.question)}: <strong>${esc(v.vote)}</strong> (${link(v.url, 'Roll Call ' + v.roll)})</p>`).join('')}</div>
        <p class="meta">Sources: ${district.sources.map((s) => link(s.url, s.name)).join(' · ')}</p>`;
    }

    fetch('/api/brief').then((r) => r.json()).then((data) => {
      const { summary, details } = briefHtml(data);
      document.getElementById('app').innerHTML = `
        <div class="hero"><div>
        <header>
          <div class="kicker">Prototype · no login · viewing as ${esc(data.district.member)}, ${esc(data.district.district)}</div>
          <h1>H.R. 1: One Big Beautiful Bill Act</h1>
          <div class="kicker">Personalized brief for ${esc(data.district.district)}, enrolled bill text</div>
        </header>
        ${mapHtml(data.map, data.district)}
        </div><div>${summary}</div></div>
        ${details}${districtHtml(data.district)}`;
      if (data.brief) wireFilter(data);
    }).catch((error) => {
      document.getElementById('app').textContent = 'Could not load the brief: ' + error.message;
    });
  </script>
</body>
</html>
